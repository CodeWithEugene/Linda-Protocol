name: Verify Linda Protocol

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/backend/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check app tests
      - name: Policy and action-card schemas load
        run: python -c "from app.library import validate_library; print(validate_library())"
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
